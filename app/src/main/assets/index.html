<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Desain Rumah 3D</title>
<style>
:root{--bg:#0e1b27;--card:#16212c;--card2:#1e2d3b;--tx:#eaf1f7;--mut:#8fa3b5;--ac:#3aa0ff;--ac2:#27d3a2;--bd:#2a3c4e;--red:#ff5d5d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;background:var(--card);border-bottom:1px solid var(--bd)}
.ttl{font-weight:800;font-size:15px;margin-right:auto;line-height:1.1}
.ttl small{display:block;font-weight:500;font-size:10px;color:var(--mut)}
.ib{min-width:38px;height:38px;padding:0 9px;border-radius:11px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font-size:16px;font-weight:700;display:grid;place-items:center}
.ib.on{background:var(--ac);border-color:var(--ac);color:#fff}
.ib:disabled{opacity:.35}
.grp{display:flex;gap:4px}
#stage{position:relative;flex:1;min-height:0;background:#0e1b27;overflow:hidden}
#c2,#gl{position:absolute;left:0;width:100%;display:block}
#glwrap{position:absolute;left:0;width:100%;background:linear-gradient(#8ec9ff 0%,#d9efff 60%,#f4f1e6 100%)}
#glwrap.night{background:linear-gradient(#050b18 0%,#0d1b33 60%,#1a2438 100%)}
#glwrap canvas{top:0;height:100%}
#hint{position:absolute;left:10px;right:10px;top:8px;pointer-events:none;text-align:center}
#hint span{display:inline-block;background:rgba(14,27,39,.88);border:1px solid var(--bd);border-radius:14px;padding:6px 12px;font-size:12px;color:var(--mut)}
#ctx{background:var(--card);border-top:1px solid var(--bd);padding:7px 10px;display:flex;gap:7px;overflow-x:auto;align-items:center;min-height:52px;touch-action:pan-x}
#ctx .b{flex:none;padding:9px 13px;border-radius:11px;background:var(--card2);border:1px solid var(--bd);color:var(--tx);font-weight:700;font-size:13px;white-space:nowrap}
#ctx .b.on{border-color:var(--ac);background:rgba(58,160,255,.18)}
#ctx .b.d{color:var(--red)}
#ctx .t{color:var(--mut);font-size:12px;padding:0 4px;flex:none}
#tools{display:grid;grid-template-columns:repeat(7,1fr);background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px)}
#tools button{background:none;border:0;color:var(--mut);font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0}
#tools button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tools button.on{color:var(--ac)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:20}
.modal.show{display:flex}
.sheet{width:100%;max-height:78vh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);touch-action:pan-y}
.sheet h3{margin:0 0 12px;font-size:16px}
.row{margin:12px 0}
.row>label{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:6px;font-weight:600}
.row>label b{color:var(--tx)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;padding:10px 6px;border-radius:11px;background:var(--card2);color:var(--tx);border:1px solid var(--bd);font-weight:700;font-size:13px}
.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.sw{display:flex;gap:9px;flex-wrap:wrap}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px #3b4f63}
.sw button.on{border-color:var(--ac)}
input[type=range]{width:100%;accent-color:var(--ac);height:28px}
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:6px 0 14px}
.stat div{background:var(--card2);border-radius:12px;padding:10px;text-align:center;font-size:11px;color:var(--mut)}
.stat b{display:block;font-size:17px;color:var(--tx);margin-bottom:2px}
.btn{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font-weight:800;font-size:14px;margin-top:8px}
.btn.p{background:var(--ac);border-color:var(--ac)}.btn.d{color:var(--red)}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:rgba(14,27,39,.95);padding:9px 16px;border-radius:20px;font-size:13px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;border:1px solid var(--bd);z-index:30}
#nowebgl{display:none;position:absolute;inset:0;place-items:center;text-align:center;padding:24px;color:var(--mut);font-size:13px;background:var(--bg)}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="ttl">Desain Rumah<small id="sub">Gambar denah, lihat 3D</small></div>
    <button class="ib" id="bUndo" title="Urungkan">↶</button>
    <button class="ib" id="bRedo" title="Ulangi">↷</button>
    <div class="grp"><button class="ib on" id="bF1">L1</button><button class="ib" id="bF2">L2</button></div>
    <div class="grp"><button class="ib" id="mPlan" title="Denah">▭</button><button class="ib" id="mSplit" title="Denah + 3D">◫</button><button class="ib" id="m3d" title="3D">⬡</button></div>
    <button class="ib" id="bMenu" title="Menu">☰</button>
  </div>
  <div id="stage">
    <canvas id="c2"></canvas>
    <div id="glwrap"><canvas id="gl"></canvas><div id="nowebgl">WebGL tidak tersedia di perangkat ini.<br>Perbarui Android System WebView / Chrome.</div></div>
    <div id="hint"><span id="hintt"></span></div>
  </div>
  <div id="ctx"></div>
  <div id="tools"></div>
</div>
<div class="modal" id="mod"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
"use strict";
/* ===================== util ===================== */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]};
const avg=p=>{const r=[0,0,0];for(const q of p){r[0]+=q[0];r[1]+=q[1];r[2]+=q[2]}return [r[0]/p.length,r[1]/p.length,r[2]/p.length]};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function hex(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16)/255,parseInt(h.substr(2,2),16)/255,parseInt(h.substr(4,2),16)/255]}
const mulc=(c,k)=>[c[0]*k,c[1]*k,c[2]*k];
const mixc=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
function persp(fov,asp,n,f){const t=1/Math.tan(fov/2),r=1/(n-f);return [t/asp,0,0,0,0,t,0,0,0,0,(n+f)*r,-1,0,0,2*n*f*r,0]}
function lookAt(e,c,u){const z=norm(sub(e,c)),x=norm(cross(u,z)),y=cross(z,x);return [x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,e),-dot(y,e),-dot(z,e),1]}
function mmul(a,b){const o=new Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++)o[j*4+i]=a[i]*b[j*4]+a[4+i]*b[j*4+1]+a[8+i]*b[j*4+2]+a[12+i]*b[j*4+3];return o}
const $=s=>document.querySelector(s);

/* ===================== pembuat mesh 3D ===================== */
class MB{
  constructor(){this.v=[]}
  tri(a,b,c,n,col,e){for(const p of [a,b,c])this.v.push(p[0],p[1],p[2],n[0],n[1],n[2],col[0],col[1],col[2],e)}
  poly(pts,ref,col,e=0){
    let n=norm(cross(sub(pts[1],pts[0]),sub(pts[2],pts[0])));
    if(dot(n,sub(avg(pts),ref))<0)n=[-n[0],-n[1],-n[2]];
    for(let i=1;i<pts.length-1;i++)this.tri(pts[0],pts[i],pts[i+1],n,col,e);
  }
  box(cx,cy,cz,sx,sy,sz,col,e=0){
    const x0=cx-sx/2,x1=cx+sx/2,y0=cy-sy/2,y1=cy+sy/2,z0=cz-sz/2,z1=cz+sz/2,r=[cx,cy,cz];
    this.poly([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],r,col,e);
    this.poly([[x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0]],r,col,e);
    this.poly([[x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1]],r,col,e);
    this.poly([[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]],r,col,e);
    this.poly([[x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0]],r,col,e);
    this.poly([[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]],r,col,e);
  }
  boxb(cx,y0,cz,sx,sy,sz,col,e=0){this.box(cx,y0+sy/2,cz,sx,sy,sz,col,e)}
  /* kotak berputar terhadap sumbu y; panjang len sepanjang arah ang */
  orbox(cx,y0,cz,len,h,th,ang,col,e=0,top=null){
    if(len<0.01||h<0.005)return;
    const c=Math.cos(ang),s=Math.sin(ang),hl=len/2,ht=th/2;
    const C=(lx,lz)=>[cx+lx*c-lz*s,cz+lx*s+lz*c];
    const a=C(-hl,-ht),b=C(hl,-ht),d=C(hl,ht),f=C(-hl,ht),y1=y0+h,ref=[cx,y0+h/2,cz];
    const q=(p,r2)=>this.poly([[p[0],y0,p[1]],[r2[0],y0,r2[1]],[r2[0],y1,r2[1]],[p[0],y1,p[1]]],ref,col,e);
    q(a,b);q(b,d);q(d,f);q(f,a);
    this.poly([[a[0],y1,a[1]],[b[0],y1,b[1]],[d[0],y1,d[1]],[f[0],y1,f[1]]],ref,top||col,e);
  }
  cyl(cx,cy,cz,r,h,seg,col,e=0,r2=null){
    r2=(r2===null)?r:r2;const ref=[cx,cy,cz];
    const P=(a,t)=>{const rr=r+(r2-r)*t;return [cx+Math.cos(a)*rr,cy+(t-.5)*h,cz+Math.sin(a)*rr]};
    for(let i=0;i<seg;i++){const a0=i/seg*Math.PI*2,a1=(i+1)/seg*Math.PI*2;
      this.poly([P(a0,0),P(a1,0),P(a1,1),P(a0,1)],ref,col,e);
      this.poly([[cx,cy-h/2,cz],P(a0,0),P(a1,0)],ref,col,e);
      if(r2>0.001)this.poly([[cx,cy+h/2,cz],P(a0,1),P(a1,1)],ref,col,e);}
  }
  sphere(cx,cy,cz,r,col,e=0,sy=1){
    const La=4,Lo=7,ref=[cx,cy,cz];
    const P=(i,j)=>{const t=i/La*Math.PI,a=j/Lo*Math.PI*2;return [cx+Math.sin(t)*Math.cos(a)*r,cy+Math.cos(t)*r*sy,cz+Math.sin(t)*Math.sin(a)*r]};
    for(let i=0;i<La;i++)for(let j=0;j<Lo;j++){const c=mulc(col,0.82+0.18*((i+j)%2));
      if(i===0)this.poly([P(i,j),P(i+1,j+1),P(i+1,j)],ref,c,e);
      else if(i===La-1)this.poly([P(i,j),P(i,j+1),P(i+1,j)],ref,c,e);
      else this.poly([P(i,j),P(i,j+1),P(i+1,j+1),P(i+1,j)],ref,c,e);}
  }
}

/* ===================== model data ===================== */
const BASE=0.15, WT=0.2;
let nid=1;
const PAL={wall:['#f1efe9','#e8dcc3','#d9d4c7','#cfd8dc','#f4e3c1','#b8c4b2','#9aa5ad','#2f3338'],roof:['#3b3f46','#8b4a2f','#6e3b32','#5a6b73','#2d4a3e','#a0522d','#1f2326']};
const newFloor=()=>({walls:[],ops:[],items:[],rooms:[]});
let D={fh:3.0,roof:'tanpa',wall:'#f1efe9',roofC:'#8b4a2f',night:false,floors:[newFloor(),newFloor()]};
const LSK='desainrumah.v1';
const CAT={ /* perabot: nama, lebar, dalam */
  sofa:{n:'Sofa',w:2.0,d:0.9},meja:{n:'Meja',w:1.0,d:0.6},makan:{n:'Meja Makan',w:1.6,d:0.9},kursi:{n:'Kursi',w:0.45,d:0.45},
  kasur:{n:'Kasur',w:1.6,d:2.0},lemari:{n:'Lemari',w:1.2,d:0.55},tv:{n:'Meja TV',w:1.5,d:0.4},dapur:{n:'Dapur',w:2.4,d:0.6},
  kulkas:{n:'Kulkas',w:0.7,d:0.7},toilet:{n:'Toilet',w:0.42,d:0.7},wastafel:{n:'Wastafel',w:0.6,d:0.45},shower:{n:'Shower',w:0.9,d:0.9},
  tangga:{n:'Tangga',w:1.0,d:3.0},pohon:{n:'Pohon',w:1.2,d:1.2},mobil:{n:'Mobil',w:1.9,d:4.3}
};
const ROOMNAMES=['Ruang Tamu','Kamar Tidur','Kamar Utama','Dapur','K. Mandi','Ruang Makan','Ruang Keluarga','Teras','Garasi','Tangga','Gudang','Ruang Kerja'];
let curF=0;
const F=()=>D.floors[curF];
/* riwayat */
let undoS=[],redoS=[];
const ser=()=>JSON.stringify({D,nid});
function pushHist(){undoS.push(ser());if(undoS.length>60)undoS.shift();redoS=[];updBtns()}
function restore(s){const o=JSON.parse(s);D=o.D;nid=o.nid;T.sel=null;changed(false)}
function undo(){if(!undoS.length)return;redoS.push(ser());restore(undoS.pop());updBtns()}
function redo(){if(!redoS.length)return;undoS.push(ser());restore(redoS.pop());updBtns()}
function updBtns(){$('#bUndo').disabled=!undoS.length;$('#bRedo').disabled=!redoS.length}
let saveT=null;
function changed(save=true){dirty2=true;rebuildSoon();updInfo();renderCtx();if(save){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LSK,ser())}catch(e){}},400)}}

/* geometri bantu */
function wallLen(w){return Math.hypot(w.x2-w.x1,w.y2-w.y1)}
function addWallTo(Fl,x1,y1,x2,y2){
  const eq=(a,b)=>Math.abs(a-b)<1e-6;
  for(const w of Fl.walls){if((eq(w.x1,x1)&&eq(w.y1,y1)&&eq(w.x2,x2)&&eq(w.y2,y2))||(eq(w.x1,x2)&&eq(w.y1,y2)&&eq(w.x2,x1)&&eq(w.y2,y1)))return w}
  const w={id:nid++,x1,y1,x2,y2};Fl.walls.push(w);return w;
}
function addRoomTo(Fl,x,y,w,h,name){
  const r={id:nid++,x,y,w,h,name};Fl.rooms.push(r);
  [[x,y,x+w,y],[x+w,y,x+w,y+h],[x+w,y+h,x,y+h],[x,y+h,x,y]].forEach(s=>addWallTo(Fl,...s));return r;
}
function nearestWall(Fl,x,y){
  let best=null,bd=1e9,bt=0;
  for(const w of Fl.walls){
    const L=wallLen(w);if(L<0.01)continue;const dx=(w.x2-w.x1)/L,dy=(w.y2-w.y1)/L;
    const t=clamp((x-w.x1)*dx+(y-w.y1)*dy,0,L);const px=w.x1+dx*t,py=w.y1+dy*t,d=Math.hypot(x-px,y-py);
    if(d<bd){bd=d;best=w;bt=t}
  }
  return best?{w:best,t:bt,d:bd}:null;
}
function addOp(Fl,kind,x,y,wid){
  const nw=nearestWall(Fl,x,y);if(!nw||nw.d>0.8)return null;
  const L=wallLen(nw.w);wid=wid||(kind==='door'?0.9:1.2);if(L<wid+0.2)return null;
  const t=clamp(Math.round(nw.t/0.25)*0.25,wid/2+0.1,L-wid/2-0.1);
  const o={id:nid++,wall:nw.w.id,t,w:wid,kind};Fl.ops.push(o);return o;
}
const opWorld=(Fl,o)=>{const w=Fl.walls.find(q=>q.id===o.wall);if(!w)return null;const L=wallLen(w),dx=(w.x2-w.x1)/L,dy=(w.y2-w.y1)/L;return {x:w.x1+dx*o.t,y:w.y1+dy*o.t,dx,dy,w}};
function bbox(Fl){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const w of Fl.walls){x0=Math.min(x0,w.x1,w.x2);x1=Math.max(x1,w.x1,w.x2);y0=Math.min(y0,w.y1,w.y2);y1=Math.max(y1,w.y1,w.y2)}
  for(const r of Fl.rooms){x0=Math.min(x0,r.x);x1=Math.max(x1,r.x+r.w);y0=Math.min(y0,r.y);y1=Math.max(y1,r.y+r.h)}
  return x0>x1?null:{x0,y0,x1,y1};
}
const base=f=>BASE+f*(D.fh+0.25);
function stats(){
  let area=0,rooms=0,walls=0,len=0;
  D.floors.forEach(Fl=>{Fl.rooms.forEach(r=>{area+=r.w*r.h;rooms++});Fl.walls.forEach(w=>{walls++;len+=wallLen(w)})});
  return {area,rooms,walls,len};
}
/* contoh denah */
function tplKecil(){
  const f0=newFloor();D.floors=[f0,newFloor()];
  addRoomTo(f0,0,0,3.5,3.5,'Kamar Tidur');addRoomTo(f0,3.5,0,2,3.5,'K. Mandi');addRoomTo(f0,5.5,0,4.5,3.5,'Dapur');
  addRoomTo(f0,0,3.5,5.5,5.5,'Ruang Tamu');addRoomTo(f0,5.5,3.5,4.5,5.5,'Ruang Makan');
  addOp(f0,'door',2.75,9);addOp(f0,'door',1.75,3.5);addOp(f0,'door',4.5,3.5);addOp(f0,'door',7.5,3.5);
  addOp(f0,'window',1,9,1.5);addOp(f0,'window',4.4,9,1.5);addOp(f0,'window',7.6,9,1.8);addOp(f0,'window',10,6.5,1.5);
  addOp(f0,'window',0,1.75,1.2);addOp(f0,'window',0,6.2,1.5);addOp(f0,'window',8,0,1.5);addOp(f0,'window',1.75,0,1.2);addOp(f0,'window',4.5,0,0.6);
  const it=(k,x,y,r=0)=>f0.items.push({id:nid++,k,x,y,rot:r});
  it('kasur',1.2,1.6,0);it('lemari',3.0,0.45,0);it('toilet',4.5,0.5,0);it('wastafel',5.2,2.0,90);it('shower',4.5,2.9,0);
  it('dapur',8.0,0.45,0);it('kulkas',9.5,1.2,0);it('sofa',2.6,7.9,180);it('tv',2.6,3.9,0);it('meja',2.6,6.3,0);it('makan',7.8,6.2,0);
  [-1,1].forEach(s=>[-0.6,0.6].forEach(z=>it('kursi',7.8+s*0.4,6.2+z*0.9,0)));
}
function tplLantai2(){
  const f0=newFloor(),f1=newFloor();D.floors=[f0,f1];
  addRoomTo(f0,0,0,3.5,3.5,'Ruang Kerja');addRoomTo(f0,3.5,0,2,3.5,'K. Mandi');addRoomTo(f0,5.5,0,5,3.5,'Dapur');
  addRoomTo(f0,0,3.5,6,6,'Ruang Tamu');addRoomTo(f0,6,3.5,4.5,6,'Ruang Makan');
  addOp(f0,'door',3,9.5);addOp(f0,'door',1.75,3.5);addOp(f0,'door',4.5,3.5);addOp(f0,'door',8,3.5);

  <div class="row"><label>Contoh denah / mulai baru</label><div class="seg" id="mTpl"></div></div>
  <button class="btn" id="mFit">Pas-kan tampilan denah & 3D</button>
  <button class="btn p" id="mClose">Selesai</button>`);
  [['tanpa','Tanpa atap'],['datar','Datar'],['pelana','Pelana'],['limas','Limas']].forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;if(D.roof===k)b.className='on';b.onclick=()=>{pushHist();D.roof=k;changed();openMenu()};$('#mRoof').appendChild(b)});
  $('#fh').oninput=e=>{D.fh=parseFloat(e.target.value);$('#fhv').textContent=D.fh.toFixed(1)+' m';changed(false);dirty2=true};$('#fh').onchange=()=>changed();$('#fh').addEventListener('pointerdown',e=>e.stopPropagation());
  $('#swW').appendChild(sw(PAL.wall,'wall',openMenu));$('#swR').appendChild(sw(PAL.roof,'roofC',openMenu));
  [[false,'Siang'],[true,'Malam']].forEach(([v,n])=>{const b=document.createElement('button');b.textContent=n;if(D.night===v)b.className='on';b.onclick=()=>{D.night=v;$('#glwrap').classList.toggle('night',v);changed();openMenu()};$('#mDay').appendChild(b)});
  [['k','Rumah kecil'],['l','2 lantai'],['n','Kosong']].forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{pushHist();if(k==='k')tplKecil();else if(k==='l')tplLantai2();else D.floors=[newFloor(),newFloor()];T.sel=null;setFloor(0);changed();setTimeout(()=>{fit2D();fitCam()},60);closeModal();toast(k==='n'?'Kanvas kosong':'Denah contoh dimuat')};$('#mTpl').appendChild(b)});
  $('#mFit').onclick=()=>{fit2D();fitCam();closeModal()};$('#mClose').onclick=closeModal;
}
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;$('#bF1').onclick=()=>setFloor(0);$('#bF2').onclick=()=>setFloor(1);
$('#mPlan').onclick=()=>setMode('plan');$('#mSplit').onclick=()=>setMode('split');$('#m3d').onclick=()=>setMode('3d');$('#bMenu').onclick=openMenu;
window.addEventListener('resize',()=>{layout();dirty2=true});
function loop(now){draw2D();draw3D(now);requestAnimationFrame(loop)}

let loaded=false;

if(!loaded)tplKecil();
$('#glwrap').classList.toggle('night',D.night);
renderTools();layout();setFloor(0);updBtns();build3D();
requestAnimationFrame(()=>{layout();fit2D();fitCam();cam.yaw=cam.tyaw=0.7;requestAnimationFrame(loop)});
